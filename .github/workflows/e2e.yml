name: End-to-end tests

# Runs the API and the web app against a fresh Postgres with the demo seed, the API connected as the
# erp_runtime role (row-level security enforced, as in production), then the Playwright browser tests.
# Three jobs side by side, each with its own database and servers: the flows (and the API checks, the antd lint and ESLint),
# and the route walk (item 89: every sidebar page in both widths and themes) in two shards. The flows job is the slowest
# (about 13 minutes of setup and checks, then over 30 of tests), so the limit leaves it room as tests are added.
on:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: flows
            args: --project=chromium
          - suite: walk-1
            args: --project=walk --workers=2 --shard=1/2
          - suite: walk-2
            args: --project=walk --workers=2 --shard=2/2
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OWNER_URL: postgresql://erp_owner:owner@localhost:5432/erp?schema=public
      RUNTIME_URL: postgresql://erp_runtime:runtime@localhost:5432/erp?schema=public
      E2E_API_URL: http://localhost:4000/api
      E2E_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: CI=true pnpm install --frozen-lockfile
      # It reads the navigation tree from @erp/shared, so the package is built first (the build later on is then quick).
      - name: Phone app has Hindi for every string it shows
        if: matrix.suite == 'flows'
        run: |
          pnpm --filter @erp/shared build
          node apps/mobile/scripts/check-i18n.mjs
      # The antd CLI's lint (deprecated props, antd's a11y and usage rules, against the installed antd; it needs no network
      # once fetched). It exits 0 whatever it finds, so its JSON is read: every issue is printed, and any fails the step.
      - name: antd lint on the web's components, app and lib
        if: matrix.suite == 'flows'
        run: |
          found=0
          for dir in components app lib; do
            npx -y @ant-design/cli@6.6.6 lint "apps/web/src/$dir" --format json > "/tmp/antd-lint-$dir.json"
            jq -r '.issues[] | "\(.file):\(.line) [\(.rule)] \(.message)"' "/tmp/antd-lint-$dir.json"
            found=$((found + $(jq '.issues | length' "/tmp/antd-lint-$dir.json")))
          done
          echo "antd lint: $found issues"
          [ "$found" -eq 0 ]
      # ESLint on the web app (UX item 89, follow-up): typescript-eslint, React hooks, Next.js and jsx-a11y. Any error fails the step,
      # and so does a warning beyond the count the lint script allows (apps/web/eslint.config.mjs says which are left).
      - name: ESLint (with jsx-a11y) on the web app
        if: matrix.suite == 'flows'
        run: pnpm --filter @erp/web lint
      - name: Database owner like Neon's (BYPASSRLS, not superuser)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE ROLE erp_owner LOGIN PASSWORD 'owner' CREATEROLE BYPASSRLS" -c "CREATE DATABASE erp OWNER erp_owner"
      - name: Migrate and seed as the owner, then give erp_runtime a login
        working-directory: apps/api
        run: |
          pnpm --filter @erp/shared build
          DATABASE_URL="$OWNER_URL" npx prisma migrate deploy
          DATABASE_URL="$OWNER_URL" npx tsx prisma/seed.ts > /dev/null
          psql "postgresql://erp_owner:owner@localhost:5432/erp" -c "ALTER ROLE erp_runtime LOGIN PASSWORD 'runtime'"
      - name: Navigation tree opens real pages, with its icons, access checks and the Concord items placed
        if: matrix.suite == 'flows'
        working-directory: apps/web
        run: npx tsx --tsconfig tsconfig.json scripts/nav-check.ts
      - name: Start the API as erp_runtime
        working-directory: apps/api
        run: |
          pnpm build
          DATABASE_URL="$RUNTIME_URL" JWT_SECRET=e2e-secret PORT=4000 STORAGE_MODE=db ORG_SIGNUP=open PUSH_DISABLED=true EMAIL_DISABLED=true PLATFORM_ADMIN_EMAILS=admin@demo.com AI_PROVIDER=fake WATI_WEBHOOK_SECRET=e2e-wati \
            RAZORPAY_KEY_ID=rzp_test_e2e RAZORPAY_KEY_SECRET=e2e-razorpay-secret RAZORPAY_WEBHOOK_SECRET=e2e-webhook-secret RAZORPAY_API_URL=http://localhost:4010/v1 \
            BILLING_PRICE=1500 BILLING_SELLER_NAME="Nirmaan Software Pvt Ltd" BILLING_SELLER_GSTIN=21AAACN1234F1Z5 BILLING_SELLER_ADDRESS="Bhubaneswar, Odisha" \
            nohup node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$E2E_API_URL/health" > /tmp/health.json && break; sleep 2; done
          cat /tmp/health.json; echo
          [ "$(jq -r .tenantGuard /tmp/health.json)" = "enforced" ]
      - name: Ask Nirmaan's tools show each role only its own projects
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/ai-access-check.js
      - name: Ask Nirmaan's drafts match the masters and save nothing
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/ai-drafts-test.js
      - name: Bill checks catch the seeded anomalies and flag nothing else
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/bill-checks-test.js
      - name: Reading invoices turns the model's reply into checked values and matches order lines
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/doc-read-test.js
      - name: The lowest rate per item splits the request between its winners, freight and all
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/purchase-award-test.js
      - name: Intelligence quick wins (insights, margin fade, cube strength, DPR, vendors, purchase controls, stages, bids)
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/intelligence-test.js
      - name: BOQ sections offer their activities' links, and dates arriving spread the undated activities
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/boq-links-test.js
      - name: A measurement sheet starts from the approved days no sheet holds yet
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/measure-from-progress-test.js
      - name: The standard norms library reads a BOQ item by its words and unit
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/norms-library-test.js
      - name: A GSTIN gives up its PAN and a new project is offered the next code in the series
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/small-fixes-test.js
      - name: The RA bill email carries the bill, and the weekly summary adds up the money in
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/action-email-test.js
      - name: Material reconciliation adds up theoretical, allowed and consumed quantities and flags each item
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/reconciliation-test.js
      - name: Stage billing shares the lump sum, reads each stage's evidence, bills it pro rata and withholds for milestone slippage
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/stage-billing-test.js
      - name: Work breakdown rolls progress up from sub-activities to components to the project, and its templates add up
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/wbs-rollup-test.js
      - name: Project types and component kinds lay out what they say, the standard ones as before, and are checked
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/project-types-test.js
      - name: Each project type's DPR form reads whole, is checked, keeps a used field's kind and reads the company's own fields
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/dpr-form-test.js
      - name: Update projects only adds what a project lacks, and a project types file reads strictly
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/type-updates-test.js
      - name: DPR work lines add up to previous, cumulative and balance, suggest material and check the crew
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/dpr-lines-test.js
      - name: Item names are one spelling, a typed line finds its master item, and duplicates group for merging
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/items-test.js
      - name: Quantities above zero, no day's record after today, measurement held to the BOQ plus its tolerance
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/validation-test.js
      - name: Wrong passwords lock an email for 15 minutes, an address trying many is held off, reset links are limited
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/login-guard-test.js
      - name: Project setup checklist, starting contract terms and the BOQ against the contract value
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/project-setup-test.js
      - name: Pipe networks read from EPANET and Excel, segments held to their length, zone sheets and working fronts
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/pipe-network-test.js
      - name: EPC deliverables, equipment packages to site, payment stages from them, client inputs and the contract currency
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/epc-test.js
      - name: O&M periods, service level penalties, staff short, the O&M bill and chemicals against their norms
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/om-test.js
      - name: PPE replace-by dates and what each worker lacks
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/ppe-test.js
      - name: RFI answer-by dates and ageing
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/rfi-test.js
      - name: Drawing marks need their points and comment, and open ones carry onto later revisions
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/markup-test.js
      - name: Approval levels place an entry at its level, pick who decides it and escalate it
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/approval-levels-test.js
      - name: Payroll works out PF, ESI, professional tax, TDS, loans and full and final settlements right
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/payroll-test.js
      - name: Management figures count supply items and lump sums as work done, find late plans and say why a project needs action
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/management-test.js
      - name: Biometric punches read from ADMS, webhooks and files and turn into the right attendance
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/biometric-test.js
      - name: Integrations keep secrets hashed and keys sealed, read pairing codes, health and batches of readings
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/integrations-test.js
      - name: Telematics read trackers and makers' feeds and roll each machine's day up from its hour meter
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/telematics-test.js
      - name: Weighbridge weighings, net weights, short supply against the challan and the watch list's short loads
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/weighbridge-test.js
      - name: A batching plant's settings, its batch report read through the column map, the first map and the order a batch was for
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/batching-test.js
      - name: The Connector's outbox keeps readings through a power cut, it reads a weighbridge indicator's frames into weighings and a batching plant's reports into rows
        if: matrix.suite == 'flows'
        working-directory: apps/connector
        run: npm test
      - name: Books check vouchers, number them by year and give every posted ledger a group
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/books-test.js
      - name: Statements put accounts on the right Schedule III lines, close a year, read bank statements and reconcile
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/statements-test.js
      - name: RMC batches, dispatch limits, bills and the day's materials add up
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/rmc-test.js
      - name: Supplier statement, dispatch limits, invoice stages and profile changes add up
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/supplier-test.js
      - name: A PO not from the lowest quotation says why, and the order email carries the order
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/po-supplier-test.js
      - name: Machine loan EMIs, schedules, positions and foreclosures add up
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/loans-test.js
      - name: Tender pricing, quotes on the SOR, bid ranks and status moves add up
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/tenders-test.js
      - name: Subcontract quotes compare, rank and award by the rules
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/comparison-test.js
      - name: Meeting actions fall due, issue and close by the rules
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/meetings-test.js
      - name: Order lines match approved makes, and approval requests go round by the rules
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/material-approvals-test.js
      - name: Schedule links refuse loops, give the critical path and float, and go to and from MS Project and P6
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/schedule-links-test.js
      - name: Earned value spreads the plan over its days and gives the indices, forecasts and earned schedule
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/earned-value-test.js
      - name: Comments need words and written mentions, tell the right people once, and only authors change them
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/comments-test.js
      - name: Module switches leave out what a company turned off or its plan lacks, and pages map to their module
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/module-switches-test.js
      - name: Group companies land a sign-in in the right company, share it only within a group, and keep an admin
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/group-companies-test.js
      - name: Launcher pins sort, Discover shows each role New, never opened and modules to ask for, and who may ask
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/launcher-test.js
      - name: Menu and names place every page in a module, show each user their own, and keep the company's names
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/nav-menu-test.js
      - name: Progress by project weighs by contract value, compares bills with contract values and notes the gaps
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/project-progress-test.js
      - name: Contract obligations fall due from their anchors, cost bills what the contract says, give back what is met, and the security deposit stops at its cap
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/contract-obligations-test.js
      - name: Masters lay the company's entries over the standard ones, keep a name in use, and sit in every department's menu
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/masters-test.js
      - name: Letters are numbered by series and financial year, wait for their signatory where the company asks, and show replies due and proof missing
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/correspondence-test.js
      - name: Quality plans count the tests owed from work done and receipts, and cubes pass or fail by IS 456
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/qa-plan-test.js
      - name: Labs, samples, calibration and test certificates follow their rules
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/qa-registers-test.js
      - name: Audit findings stand open, by NCR or closed, and the monthly quality report adds up
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/qa-audits-test.js
      - name: The drawing schedule finds late drawings, numbers new ones and words the reminder
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/drawing-schedule-test.js
      - name: Design submissions take their codes, close answered comments, go again only with every comment answered
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/design-submissions-test.js
      - name: Controlled copies are numbered and recalled, a new revision lists what it changes, the design dashboard adds up
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/design-control-test.js
      - name: Measures on drawings scale right, add up lines, areas and counts, and make measurement book lines
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: node dist/scripts/takeoff-test.js
      - name: Early warnings forecast right, show each role its own kinds and backtest on the demo history
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/warnings-test.js
      - name: Morning briefs and weekly narratives use only the records' figures and go once to those who asked
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/briefs-test.js
      - name: Ask the contract finds each of the 30 sample questions on its page and shows each role only its own documents
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/contract-search-test.js
      - name: WhatsApp entries read each provider's webhook, draft from text, voice and photos, and save only on the sender's Save
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/whatsapp-capture-test.js
      - name: Leakage checks find every seeded leak (material, rate, fuel with no log, idle hire) and agree with the watch list
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/leakage-test.js
      - name: Cash forecast adds up from the books, keeps its weekly snapshot and replays past weeks against what was paid
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/cash-forecast-test.js
      - name: Hindrances read from 100 labelled DPR remarks, recorded as delays, and the notice clock on the watch list
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/hindrance-test.js
      - name: Man-day bills checked against the head count, roll call and punches, with the labelled crew backtest
        if: matrix.suite == 'flows'
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/attendance-check-test.js
      - name: Site photo checks keep the confidence bar, the 50 labelled photos and the safety officer's switch
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/photo-checks-test.js
      - name: Ask Nirmaan stays within the plan's allowance, stops when read-only and keeps its log for admins
        working-directory: apps/api
        run: DATABASE_URL="$RUNTIME_URL" node dist/scripts/ai-billing-test.js
      - name: Build and start the web app
        working-directory: apps/web
        run: |
          NEXT_PUBLIC_API_URL="$E2E_API_URL" npx next build
          nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$E2E_WEB_URL/login" && break; sleep 2; done
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright (${{ matrix.suite }})
        working-directory: e2e
        run: npx playwright test ${{ matrix.args }}
      - if: failure()
        run: tail -100 /tmp/api.log; tail -50 /tmp/web.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: e2e/playwright-report
          retention-days: 7
      # Full-page screenshots of every walked page (role / width-theme / page), for reviewers; nothing is compared.
      - if: always() && matrix.suite != 'flows'
        uses: actions/upload-artifact@v4
        with:
          name: route-walk-screens-${{ matrix.suite }}
          path: e2e/route-walk/screens
          if-no-files-found: ignore
          retention-days: 7

  # One check named `e2e` (what branch protection asks for): green only when all three jobs above are.
  e2e:
    name: e2e
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.suite.result }}" = "success" ] || { echo "e2e jobs: ${{ needs.suite.result }}"; exit 1; }'
