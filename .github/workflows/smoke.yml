name: Smoke test (production)

on:
  workflow_dispatch:
  push:
    branches: [claude/modest-brown-emrt4b]
    paths: ['.github/workflows/smoke.yml']

env:
  API_URL: https://construction-erp-api-pradeep15.vercel.app/api
  WEB_URL: https://construction-erp-web-pradeep15.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API health
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$API_URL/health" || true)
            echo "attempt $i: $code"; cat /tmp/health.json 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
      - name: Login and read data
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]
          echo "login ok"
          curl -sf "$API_URL/projects" -H "authorization: Bearer $TOKEN" | jq -r '.items[] | "\(.code)  \(.physicalProgressPct)%  pending=\(.pendingApprovals)"'
          echo "pending approvals: $(curl -sf "$API_URL/approvals/pending" -H "authorization: Bearer $TOKEN" | jq length)"
          curl -sf "$API_URL/dashboard/company" -H "authorization: Bearer $TOKEN" | jq 'del(.projects)'
      - name: Clients and contract terms
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          curl -sf "$API_URL/clients" -H "$H" | jq -r '.items[] | "\(.name)  GSTIN \(.gstin)  projects=\(.projectCount)"'
          PROJECT=$(curl -sf "$API_URL/projects?sortBy=code" -H "$H" | jq -r '.items[0].id')
          curl -sf "$API_URL/projects/$PROJECT/contract" -H "$H" | jq -c '{agreementNo, client: .client.name, endDate, extensionDays, revisedEndDate, retentionPct, gstRate}'
          ENG=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/projects/$PROJECT/contract" -H "authorization: Bearer $ENG")
          echo "contract as a site engineer: $code"; [ "$code" = "403" ]
      - name: RA bills
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"qs@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          curl -sf "$API_URL/ra-bills?sortBy=billNo&sortOrder=asc" -H "$H" | jq -c '.items[] | {billLabel, projectCode, grossAmount, netPayable, status, stage, measurementCount}'
          BILL=$(curl -sf "$API_URL/ra-bills?sortBy=billNo&sortOrder=asc" -H "$H" | jq -r '.items[0].id')
          curl -sf "$API_URL/ra-bills/$BILL" -H "$H" | jq -e '.items | length > 0' > /dev/null
          ENG=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/ra-bills" -H "authorization: Bearer $ENG")
          echo "bills as a site engineer: $code"; [ "$code" = "403" ]
      - name: Receivables
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"accounts@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          curl -sf "$API_URL/receivables" -H "$H" | jq -c '.totals | {billed, received, outstanding, retentionHeld, tdsDeducted}'
          curl -sf "$API_URL/receivables" -H "$H" | jq -e '(.projects | length > 0) and (.totals.billed | tonumber > 0)' > /dev/null
          curl -sf "$API_URL/receipts" -H "$H" | jq -e '.total >= 1' > /dev/null
          ENG=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/receivables" -H "authorization: Bearer $ENG")
          echo "receivables as a site engineer: $code"; [ "$code" = "403" ]
      - name: Vendors
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"procurement@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          curl -sf "$API_URL/vendors" -H "$H" | jq -c '.total, [.items[] | {name, kinds, msmeCategory, grnCount, equipmentCount, expenseCount}]'
          curl -sf "$API_URL/vendors" -H "$H" | jq -e '.total >= 1' > /dev/null
          curl -sf "$API_URL/vendors/unlisted" -H "$H" | jq -c '[.[].name]'
          ENG=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          curl -sf "$API_URL/vendors" -H "authorization: Bearer $ENG" | jq -e '[.items[].bankAccountNo] | all(. == null)' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/vendors" -H "authorization: Bearer $ENG" -H 'content-type: application/json' -d '{"name":"Smoke test vendor"}')
          echo "add vendor as a site engineer: $code"; [ "$code" = "403" ]
      - name: Purchasing
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"procurement@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          curl -sf "$API_URL/purchase-orders" -H "$H" | jq -c '.total, [.items[] | {poNo, vendorName, status, total, receivedPct, closedAt}]'
          curl -sf "$API_URL/purchase-orders" -H "$H" | jq -e '.total >= 1' > /dev/null
          curl -sf "$API_URL/vendor-bills" -H "$H" | jq -c '.total, [.items[] | {billNo, vendorName, status, matched, dueDate}]'
          ENG=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/vendor-bills" -H "authorization: Bearer $ENG")
          echo "vendor bills as a site engineer: $code"; [ "$code" = "403" ]
      - name: Notifications
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          curl -sf "$API_URL/notifications?limit=3" -H "authorization: Bearer $TOKEN" | jq '{unreadCount, items: [.items[] | {type, title}]}'
          curl -s -o /dev/null -w 'cron without secret: %{http_code}\n' "$API_URL/notifications/jobs/dpr-reminder"
      - name: Upload a photo and read it back
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          printf '\x89PNG\r\n\x1a\n' > /tmp/t.png; head -c 64 /dev/urandom >> /tmp/t.png
          URL=$(curl -sf -X POST "$API_URL/uploads" -H "authorization: Bearer $TOKEN" -F file=@/tmp/t.png | tee /dev/stderr | jq -r .url)
          echo; curl -sf -o /dev/null -w 'content: %{http_code} %{content_type}\n' "https://construction-erp-api-pradeep15.vercel.app$URL"
      - name: Edit a draft and resubmit (PATCH + submit)
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          ACTIVITY=$(curl -sf "$API_URL/projects/$PROJECT/activities" -H "$H" | jq -r '.[0].id')
          TODAY=$(date -u +%F)
          ID=$(curl -sf -X POST "$API_URL/progress" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"activityId\":\"$ACTIVITY\",\"date\":\"$TODAY\",\"quantity\":\"1\",\"remarks\":\"smoke draft\",\"submit\":false}" | jq -r .id)
          echo "draft $ID"
          STATUS=$(curl -sf -X PATCH "$API_URL/progress/$ID" -H "$H" -H 'content-type: application/json' \
            -d '{"quantity":"2","remarks":"smoke draft edited","attachmentIds":[]}' | jq -r '"\(.status) \(.quantity) \(.remarks)"')
          echo "after edit: $STATUS"; [ "$STATUS" = "DRAFT 2 smoke draft edited" ]
          curl -sf "$API_URL/approvals/progress/$ID/audit" -H "$H" | jq -r '.[] | .action' | grep -q UPDATED
          # Clean up: a draft can be deleted by its author
          curl -sf -X DELETE "$API_URL/progress/$ID" -H "$H" | jq -c .
      - name: Idempotent create with a client id (offline sync)
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"engineer@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          ACTIVITY=$(curl -sf "$API_URL/projects/$PROJECT/activities" -H "$H" | jq -r '.[0].id')
          CID=$(cat /proc/sys/kernel/random/uuid)
          BODY="{\"id\":\"$CID\",\"projectId\":\"$PROJECT\",\"activityId\":\"$ACTIVITY\",\"date\":\"$(date -u +%F)\",\"quantity\":\"1\",\"remarks\":\"smoke offline\",\"submit\":false}"
          A=$(curl -sf -X POST "$API_URL/progress" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r .id)
          B=$(curl -sf -X POST "$API_URL/progress" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r .id)
          echo "first $A, retry $B"; [ "$A" = "$CID" ] && [ "$B" = "$CID" ]
          curl -sf "$API_URL/approvals/progress/$CID/audit" -H "$H" | jq -r '[.[] | .action] | join(",")' | grep -qx 'CREATED'
          curl -sf -X DELETE "$API_URL/progress/$CID" -H "$H" | jq -c .
      - name: Attendance feeds DPR manpower
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"tl@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          DAY=2000-01-03   # far in the past so it never touches real days
          # Leftovers from an interrupted run
          OLD=$(curl -sf "$API_URL/attendance/day?projectId=$PROJECT&date=$DAY" -H "$H" | jq -r '.sheet.id // empty')
          [ -n "$OLD" ] && curl -sf -X DELETE "$API_URL/attendance/$OLD" -H "$H" > /dev/null
          for D in $(curl -sf "$API_URL/dpr?projectId=$PROJECT&q=smoke-attendance&pageSize=50" -H "$H" | jq -r '.items[].id'); do curl -sf -X DELETE "$API_URL/dpr/$D" -H "$H" > /dev/null; done
          CID=$(cat /proc/sys/kernel/random/uuid)
          BODY="{\"id\":\"$CID\",\"projectId\":\"$PROJECT\",\"date\":\"$DAY\",\"lines\":[{\"contractor\":\"Departmental\",\"category\":\"Supervisor\",\"count\":1},{\"contractor\":\"Smoke Labour\",\"category\":\"Helper\",\"count\":4},{\"contractor\":\"Smoke Labour 2\",\"category\":\"Helper\",\"count\":3}]}"
          A=$(curl -sf -X POST "$API_URL/attendance" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '"\(.id) \(.totalWorkers)"')
          B=$(curl -sf -X POST "$API_URL/attendance" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '"\(.id) \(.totalWorkers)"')
          echo "attendance: $A, retry: $B"; [ "$A" = "$CID 8" ] && [ "$B" = "$CID 8" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/attendance" -H "$H" -H 'content-type: application/json' -d "{\"projectId\":\"$PROJECT\",\"date\":\"$DAY\",\"lines\":[{\"contractor\":\"X\",\"category\":\"Helper\",\"count\":1}]}")
          echo "second sheet for the same day: $code"; [ "$code" = "409" ]
          # A DPR sent without manpower takes it from the attendance sheet
          DPR=$(curl -sf -X POST "$API_URL/dpr" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"date\":\"$DAY\",\"workExecuted\":\"smoke-attendance\",\"submit\":false}")
          echo "$DPR" | jq -c '{manpower, totalManpower}'
          echo "$DPR" | jq -e '.totalManpower == 8 and ([.manpower[] | select(.category == "Helper") | .count] == [7])' > /dev/null
          curl -sf -X DELETE "$API_URL/dpr/$(echo "$DPR" | jq -r .id)" -H "$H" > /dev/null
          curl -sf "$API_URL/attendance?projectId=$PROJECT&from=$DAY&to=$DAY" -H "$H" | jq -e '.total == 1' > /dev/null
          curl -sf -X DELETE "$API_URL/attendance/$CID" -H "$H" | jq -c .
      - name: Stock receipt, issue and low-stock rules
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          DAY=2000-01-03   # far in the past so it never touches real days
          ITEM_NAME="Smoke test item"
          cleanup() {
            # Clear the minimum first so the clean-up raises no low-stock alert; then issues, so the balance never goes below zero
            for I in $(curl -sf "$API_URL/stock/items?q=Smoke%20test%20item" -H "$H" | jq -r '.items[].id'); do
              curl -sf -X PUT "$API_URL/stock/min-levels" -H "$H" -H 'content-type: application/json' -d "{\"projectId\":\"$PROJECT\",\"itemId\":\"$I\",\"minQty\":null}" > /dev/null
            done
            for T in ISSUE ADJUSTMENT; do
              for E in $(curl -sf "$API_URL/stock/entries?projectId=$PROJECT&type=$T&q=Smoke%20test%20item&pageSize=50" -H "$H" | jq -r '.items[].id'); do
                curl -sf -X DELETE "$API_URL/stock/entries/$E" -H "$H" > /dev/null
              done
            done
            for I in $(curl -sf "$API_URL/stock/items?q=Smoke%20test%20item" -H "$H" | jq -r '.items[].id'); do curl -sf -X DELETE "$API_URL/stock/items/$I" -H "$H" > /dev/null; done
          }
          cleanup
          CID=$(cat /proc/sys/kernel/random/uuid)
          BODY="{\"id\":\"$CID\",\"projectId\":\"$PROJECT\",\"date\":\"$DAY\",\"remarks\":\"smoke opening stock\",\"lines\":[{\"itemName\":\"$ITEM_NAME\",\"unit\":\"Nos\",\"quantity\":\"10\"}]}"
          A=$(curl -sf -X POST "$API_URL/stock/adjustments" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r .entryNo)
          B=$(curl -sf -X POST "$API_URL/stock/adjustments" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r .entryNo)
          echo "opening stock: $A, retry: $B"; [ "$A" = "$B" ]
          ITEM=$(curl -sf "$API_URL/stock/items?q=Smoke%20test%20item" -H "$H" | jq -r '.items[0].id')
          curl -sf -X POST "$API_URL/stock/issues" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"date\":\"$DAY\",\"issuedTo\":\"Smoke gang\",\"lines\":[{\"itemId\":\"$ITEM\",\"quantity\":\"4\"}]}" | jq -c '{entryNo, lines: [.lines[].quantity]}'
          # Minimum set after the issue, so the run raises no low-stock notification for the demo store manager
          curl -sf -X PUT "$API_URL/stock/min-levels" -H "$H" -H 'content-type: application/json' -d "{\"projectId\":\"$PROJECT\",\"itemId\":\"$ITEM\",\"minQty\":\"8\"}" | jq -e '.balance == "6" and .low == true' > /dev/null
          curl -sf "$API_URL/stock/balances?projectId=$PROJECT&q=Smoke%20test%20item" -H "$H" | jq -c '.items[0] | {balance, minQty, low}'
          curl -sf "$API_URL/stock/balances?projectId=$PROJECT&q=Smoke%20test%20item" -H "$H" | jq -e '.items[0].balance == "6" and .items[0].low == true' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/stock/issues" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"date\":\"$DAY\",\"issuedTo\":\"Smoke gang\",\"lines\":[{\"itemId\":\"$ITEM\",\"quantity\":\"7\"}]}")
          echo "issue above stock: $code"; [ "$code" = "409" ]
          curl -sf "$API_URL/stock/receivable" -H "$H" | jq -r '"approved requests waiting for material: \(length)"'
          cleanup
          curl -sf "$API_URL/stock/items?q=Smoke%20test%20item" -H "$H" | jq -e '.total == 0' > /dev/null
      - name: Machinery log rules
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          DAY=2000-01-03
          cleanup() {
            for EQ in $(curl -sf "$API_URL/equipment?q=SMOKE-01&includeInactive=true" -H "$H" | jq -r '.items[].id'); do
              for L in $(curl -sf "$API_URL/machinery-logs?equipmentId=$EQ&pageSize=50" -H "$H" | jq -r '.items[].id'); do curl -sf -X DELETE "$API_URL/machinery-logs/$L" -H "$H" > /dev/null; done
              curl -sf -X DELETE "$API_URL/equipment/$EQ" -H "$H" > /dev/null
            done
          }
          cleanup
          EQ=$(curl -sf -X POST "$API_URL/equipment" -H "$H" -H 'content-type: application/json' \
            -d '{"code":"SMOKE-01","name":"Smoke test machine","ownership":"HIRED","rate":"1000","rateUnit":"HOUR"}' | jq -r .id)
          CID=$(cat /proc/sys/kernel/random/uuid)
          # Drafts (submit:false) so the run sends no approval notifications
          BODY="{\"id\":\"$CID\",\"projectId\":\"$PROJECT\",\"equipmentId\":\"$EQ\",\"date\":\"$DAY\",\"hoursWorked\":\"6.5\",\"idleHours\":\"1\",\"dieselLitres\":\"40\",\"submit\":false}"
          A=$(curl -sf -X POST "$API_URL/machinery-logs" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '.id + " " + .hoursWorked + " " + .status')
          B=$(curl -sf -X POST "$API_URL/machinery-logs" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '.id + " " + .hoursWorked + " " + .status')
          echo "log: $A, retry: $B"; [ "$A" = "$B" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/machinery-logs" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"equipmentId\":\"$EQ\",\"date\":\"$DAY\",\"hoursWorked\":\"2\",\"submit\":false}")
          echo "second log same day: $code"; [ "$code" = "409" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/machinery-logs" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"equipmentId\":\"$EQ\",\"date\":\"2000-01-04\",\"hoursWorked\":\"20\",\"idleHours\":\"5\",\"submit\":false}")
          echo "25 hours in a day: $code"; [ "$code" = "400" ]
          curl -sf "$API_URL/equipment/$EQ" -H "$H" | jq -e '.rate == "1000.00" and .lastLogDate == "2000-01-03"' > /dev/null
          cleanup
          curl -sf "$API_URL/equipment?q=SMOKE-01&includeInactive=true" -H "$H" | jq -e '.total == 0' > /dev/null
      - name: Site expense with GST
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          cleanup() {
            for X in $(curl -sf "$API_URL/expenses?q=Smoke%20test%20expense&pageSize=50" -H "$H" | jq -r '.items[].id'); do curl -sf -X DELETE "$API_URL/expenses/$X" -H "$H" > /dev/null; done
          }
          cleanup
          CID=$(cat /proc/sys/kernel/random/uuid)
          # A draft (submit:false) so the run sends no approval notifications
          BODY="{\"id\":\"$CID\",\"projectId\":\"$PROJECT\",\"date\":\"2000-01-03\",\"category\":\"REPAIRS\",\"description\":\"Smoke test expense\",\"amount\":\"1000\",\"gstRate\":\"18\",\"submit\":false}"
          A=$(curl -sf -X POST "$API_URL/expenses" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '.expenseNo + " " + .gstAmount + " " + .totalAmount')
          B=$(curl -sf -X POST "$API_URL/expenses" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '.expenseNo + " " + .gstAmount + " " + .totalAmount')
          echo "expense: $A, retry: $B"; [ "$A" = "$B" ]; echo "$A" | grep -q ' 180.00 1180.00$'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/expenses" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"date\":\"2000-01-03\",\"category\":\"REPAIRS\",\"description\":\"Smoke test expense\",\"amount\":\"1000\",\"gstRate\":\"18\",\"gstAmount\":\"150\",\"submit\":false}")
          echo "GST not matching the rate: $code"; [ "$code" = "400" ]
          curl -sf "$API_URL/expenses/summary?q=Smoke%20test%20expense" -H "$H" | jq -e '.count == 1 and .totalAmount == "1180.00" and .approvedTotal == "0.00"' > /dev/null
          cleanup
          curl -sf "$API_URL/expenses/summary?projectId=$PROJECT" -H "$H" | jq -r '"project expenses: \(.count), approved ₹\(.approvedTotal), pending ₹\(.pendingTotal)"'
      - name: Measurement book
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          BOQ=$(curl -sf "$API_URL/projects/$PROJECT/boq" -H "$H" | jq -r '.[0].id')
          cleanup() {
            for X in $(curl -sf "$API_URL/measurements?q=Smoke%20test%20location&pageSize=50" -H "$H" | jq -r '.items[].id'); do curl -sf -X DELETE "$API_URL/measurements/$X" -H "$H" > /dev/null; done
          }
          cleanup
          CID=$(cat /proc/sys/kernel/random/uuid)
          # A draft (submit:false): 1 x 10 x 2 x 0.5 less a 0.5 deduction = 9.5
          BODY="{\"id\":\"$CID\",\"projectId\":\"$PROJECT\",\"boqItemId\":\"$BOQ\",\"date\":\"2000-01-03\",\"location\":\"Smoke test location\",\"lines\":[{\"description\":\"Block\",\"nos\":\"1\",\"length\":\"10\",\"breadth\":\"2\",\"depth\":\"0.5\"},{\"description\":\"Opening\",\"length\":\"1\",\"breadth\":\"1\",\"depth\":\"0.5\",\"deduct\":true}],\"submit\":false}"
          A=$(curl -sf -X POST "$API_URL/measurements" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '.mbNo + " " + (.totalQty | tonumber | tostring)')
          B=$(curl -sf -X POST "$API_URL/measurements" -H "$H" -H 'content-type: application/json' -d "$BODY" | jq -r '.mbNo + " " + (.totalQty | tonumber | tostring)')
          echo "measurement: $A, retry: $B"; [ "$A" = "$B" ]; echo "$A" | grep -q ' 9.5$'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/measurements" -H "$H" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"boqItemId\":\"$BOQ\",\"date\":\"2000-01-03\",\"location\":\"Smoke test location\",\"lines\":[{\"description\":\"Nothing\"}],\"submit\":false}")
          echo "line without dimensions: $code"; [ "$code" = "400" ]
          cleanup
          curl -sf "$API_URL/projects/$PROJECT/boq" -H "$H" | jq -r '"measured value on the project: ₹\([.[].measuredAmount | tonumber] | add)"'
      - name: Project cost view
        run: |
          set -e
          login() { curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d "{\"email\":\"$1\",\"password\":\"password123\"}" | jq -r .accessToken; }
          H="authorization: Bearer $(login pm@demo.com)"
          curl -sf "$API_URL/cost/projects" -H "$H" | jq -e 'length > 0 and all(.[]; (.cost.total | tonumber) >= 0 and (.executedValue | type) == "string")' > /dev/null
          curl -sf "$API_URL/cost/projects" -H "$H" | jq -r '.[] | "\(.projectCode): executed ₹\(.executedValue), cost ₹\(.cost.total), margin ₹\(.margin)"'
          PROJECT=$(curl -sf "$API_URL/cost/projects" -H "$H" | jq -r '.[0].projectId')
          curl -sf "$API_URL/cost/projects/$PROJECT?from=2000-01-01" -H "$H" | jq -e '(.months | type) == "array" and (.labourByTrade | type) == "array"' > /dev/null
          curl -sf "$API_URL/cost/labour-rates" -H "$H" | jq -r '"labour rates: \(.rates | length), trades without a rate: \(.unpricedTrades | length)"'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/cost/projects" -H "authorization: Bearer $(login engineer@demo.com)")
          echo "site engineer: $code"; [ "$code" = "403" ]
      - name: Progress report
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          FROM=$(date -u +%Y-%m-01); TO=$(date -u +%Y-%m-%d)
          curl -sf "$API_URL/reports/progress?projectId=$PROJECT&from=$FROM&to=$TO" -H "$H" \
            | jq -e '.physical.atEndPct >= .physical.atStartPct and (.activities | length) > 0 and (.financial.cumulativeValue | type) == "string"' > /dev/null
          curl -sf "$API_URL/reports/progress?projectId=$PROJECT&from=$FROM&to=$TO" -H "$H" \
            | jq -r '"\(.project.code) \(.from)..\(.to): physical \(.physical.atStartPct)% -> \(.physical.atEndPct)%, executed ₹\(.financial.periodValue)"'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/reports/progress?projectId=$PROJECT&from=2026-01-01&to=2026-12-31" -H "$H")
          echo "over 92 days: $code"; [ "$code" = "400" ]
      - name: Delay and risk register
        run: |
          set -e
          login() { curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d "{\"email\":\"$1\",\"password\":\"password123\"}" | jq -r .accessToken; }
          H="authorization: Bearer $(login pm@demo.com)"
          curl -sf "$API_URL/risks?active=true&pageSize=50" -H "$H" | jq -e '.total > 0 and ([.items[].score] == ([.items[].score] | sort | reverse)) and all(.items[]; .status != "CLOSED")' > /dev/null
          curl -sf "$API_URL/risks/summary" -H "$H" | jq -e '(.heat | length) == 5 and all(.heat[]; length == 5) and (.daysLost | type) == "number"' > /dev/null
          curl -sf "$API_URL/risks/summary" -H "$H" | jq -r '"open \(.open), high risks \(.highRisks), delays holding up work \(.openDelays), days lost \(.daysLost) (excusable \(.excusableDaysLost))"'
          curl -sf "$API_URL/risks/suggestions" -H "$H" | jq -r '"delayed activities without a delay entry: \(length)"'
          PROJECT=$(curl -sf "$API_URL/projects" -H "$H" | jq -r '.items[0].id')
          FROM=$(date -u +%Y-%m-01); TO=$(date -u +%Y-%m-%d)
          curl -sf "$API_URL/reports/progress?projectId=$PROJECT&from=$FROM&to=$TO" -H "$H" | jq -e '(.delays | type) == "array" and (.risks | type) == "array"' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/risks" -H "authorization: Bearer $(login accounts@demo.com)" -H 'content-type: application/json' \
            -d "{\"projectId\":\"$PROJECT\",\"kind\":\"RISK\",\"category\":\"OTHER\",\"title\":\"smoke\",\"impact\":2}")
          echo "accounts raising a risk: $code"; [ "$code" = "403" ]
      - name: Activity templates
        run: |
          set -e
          login() { curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d "{\"email\":\"$1\",\"password\":\"password123\"}" | jq -r .accessToken; }
          H="authorization: Bearer $(login pm@demo.com)"
          curl -sf "$API_URL/activity-templates" -H "$H" | jq -e 'length == 3 and all(.[]; (.items | length) > 0 and .spanDays > 0)' > /dev/null
          curl -sf "$API_URL/activity-templates" -H "$H" | jq -r '.[] | "\(.projectType): \(.items | length) activities over \(.spanDays) days\(if .isDefault then " (standard)" else "" end)"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$API_URL/activity-templates/ROAD" -H "$H" -H 'content-type: application/json' -d '{"items":[]}')
          echo "PM changing a template: $code"; [ "$code" = "403" ]
      - name: Approval matrix
        run: |
          set -e
          login() { curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d "{\"email\":\"$1\",\"password\":\"password123\"}" | jq -r .accessToken; }
          ADMIN="authorization: Bearer $(login admin@demo.com)"
          PM="authorization: Bearer $(login pm@demo.com)"
          curl -sf "$API_URL/approval-rules" -H "$ADMIN" | jq -r '"matrix: \(if .custom then "custom" else "standard rule" end), \(.rules | length) rules"'
          curl -sf "$API_URL/auth/me" -H "$PM" | jq -e '.approvalRights | length > 0' > /dev/null
          curl -sf "$API_URL/auth/me" -H "$PM" | jq -r '"PM may approve: " + ([.approvalRights[] | .type + (if .maxAmount then " up to " + .maxAmount else "" end)] | join(", "))'
          curl -sf "$API_URL/approvals/pending" -H "$PM" | jq -e 'all(.[]; has("amount"))' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/approval-rules" -H "$PM")
          echo "PM reading the matrix: $code"; [ "$code" = "403" ]
      - name: Invite, set password and reset
        run: |
          set -e
          login() { curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' -d "{\"email\":\"$1\",\"password\":\"$2\"}" | jq -r .accessToken; }
          ADMIN="authorization: Bearer $(login admin@demo.com password123)"
          OPTS=$(curl -sf "$API_URL/auth/options"); echo "auth options: $OPTS"
          if [ "$(echo "$OPTS" | jq .signup)" = "false" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/auth/signup" -H 'content-type: application/json' \
              -d '{"organizationName":"Smoke Org","fullName":"Smoke","email":"smoke-signup@example.com","password":"smoke-pass-1"}')
            echo "sign-up while closed: $code"; [ "$code" = "403" ]
          fi
          # One reusable smoke user: invite once, later runs ask for a fresh link
          EMAIL=smoke-invite@demo.com
          ID=$(curl -sf "$API_URL/users?q=$EMAIL" -H "$ADMIN" | jq -r '.items[0].id // empty')
          if [ -z "$ID" ]; then
            LINK=$(curl -sf -X POST "$API_URL/users" -H "$ADMIN" -H "origin: $WEB_URL" -H 'content-type: application/json' \
              -d "{\"email\":\"$EMAIL\",\"fullName\":\"Smoke Invite\",\"roleKey\":\"SITE_ENGINEER\"}" | jq -r .invite.link)
          else
            curl -sf -X PATCH "$API_URL/users/$ID" -H "$ADMIN" -H 'content-type: application/json' -d '{"isActive":true}' > /dev/null
            LINK=$(curl -sf -X POST "$API_URL/users/$ID/password-link" -H "$ADMIN" -H "origin: $WEB_URL" | jq -r .link)
          fi
          TOKEN=${LINK##*token=}; [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]
          curl -sf "$API_URL/auth/password-token/$TOKEN" | jq -r '"link for \(.email) (\(.purpose)) at \(.organizationName)"'
          PW="smoke-$(cat /proc/sys/kernel/random/uuid | cut -c1-12)"
          curl -sf -X POST "$API_URL/auth/set-password" -H 'content-type: application/json' -d "{\"token\":\"$TOKEN\",\"password\":\"$PW\"}" | jq -e '.user.email == "smoke-invite@demo.com"' > /dev/null
          [ -n "$(login $EMAIL "$PW")" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/auth/set-password" -H 'content-type: application/json' -d "{\"token\":\"$TOKEN\",\"password\":\"$PW\"}")
          echo "link used twice: $code"; [ "$code" = "400" ]
          curl -sf -X POST "$API_URL/auth/forgot-password" -H 'content-type: application/json' -d '{"email":"nobody@example.com"}' | jq -e '.ok' > /dev/null
          # Leave the smoke user switched off
          ID=$(curl -sf "$API_URL/users?q=$EMAIL" -H "$ADMIN" | jq -r '.items[0].id')
          curl -sf -X PATCH "$API_URL/users/$ID" -H "$ADMIN" -H 'content-type: application/json' -d '{"isActive":false}' > /dev/null
      - name: Tenant guard (row-level security)
        run: |
          set -e
          G=$(curl -sf "$API_URL/health" | jq -r .tenantGuard)
          echo "tenant guard: $G"
          if [ "$G" != "enforced" ]; then echo "::warning::Postgres row-level security is $G (see docs/DEPLOY.md, TENANT_RLS)"; fi
      - name: Paged lists with search and sort
        run: |
          set -e
          TOKEN=$(curl -sf -X POST "$API_URL/auth/login" -H 'content-type: application/json' \
            -d '{"email":"pm@demo.com","password":"password123"}' | jq -r .accessToken)
          H="authorization: Bearer $TOKEN"
          curl -sf "$API_URL/progress?page=1&pageSize=5&sortBy=quantity&sortOrder=desc" -H "$H" | jq -e '(.items | length) <= 5 and .page == 1 and .pageSize == 5 and (.total | type) == "number"' > /dev/null
          curl -sf "$API_URL/progress?pageSize=5&sortBy=quantity&sortOrder=desc" -H "$H" | jq -r '"progress total=\(.total) top qty=\([.items[].quantity] | join(","))"'
          curl -sf "$API_URL/material-requests?q=cement" -H "$H" | jq -r '"MR matching cement: \(.total)"'
          curl -sf "$API_URL/dpr?sortBy=date&pageSize=1" -H "$H" | jq -r '"latest DPR: \(.items[0].date // "none") of \(.total)"'
          curl -sf "$API_URL/users?pageSize=1" -H "$H" | jq -e '.total > 1' > /dev/null
          curl -sf "$API_URL/attendance?sortBy=totalWorkers&pageSize=1" -H "$H" | jq -r '"attendance sheets: \(.total), largest day \(.items[0].totalWorkers // 0) workers"'
          curl -sf "$API_URL/stock/balances?lowOnly=true&pageSize=5" -H "$H" | jq -r '"items below minimum: \(.total)"'
          curl -sf "$API_URL/stock/entries?sortBy=date&pageSize=1" -H "$H" | jq -r '"stock entries: \(.total), latest \(.items[0].entryNo // "none")"'
          curl -sf "$API_URL/machinery-logs?breakdownOnly=true&pageSize=1" -H "$H" | jq -r '"machinery logs with a breakdown: \(.total)"'
          curl -sf "$API_URL/measurements?sortBy=totalQty&pageSize=1" -H "$H" | jq -r '"measurement sheets: \(.total)"'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/progress?sortBy=nope" -H "$H"); echo "bad sortBy: $code"; [ "$code" = "400" ]
      - name: Swagger docs and CORS
        run: |
          curl -s -o /dev/null -w 'docs: %{http_code}\n' "$API_URL/docs"
          curl -s -o /dev/null -D - -X OPTIONS "$API_URL/auth/login" \
            -H "Origin: $WEB_URL" -H "Access-Control-Request-Method: POST" | grep -i 'HTTP/\|access-control-allow-origin'
      - name: Web pages
        run: |
          curl -s -o /dev/null -w 'login page: %{http_code}\n' "$WEB_URL/login"
          curl -s -o /dev/null -w 'root redirect: %{http_code} -> %{redirect_url}\n' "$WEB_URL/"
          curl -s "$WEB_URL/login" | grep -o 'NEXT_PUBLIC_API_URL[^"]*' | head -1 || true
          curl -s "$WEB_URL/login" | grep -o 'construction-erp-api[^"]*' | head -3 || true
